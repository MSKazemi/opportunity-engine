name: Bug report
description: Something behaves differently from what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please redact any personal data before pasting output. Never paste a CV or an
        application into a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: The exact command you ran
      render: shell
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `opp doctor`
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: "`opp --version`, or the commit you are on"
    validations: { required: true }
